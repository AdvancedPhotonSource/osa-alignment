[project]
name = "osa-alignment-evaluator"
version = "0.1.0"
description = "Brightness symmetry axes and intersection-guided OSA alignment"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.15,<2",
    "pillow>=11,<13",
]

[dependency-groups]
analysis = ["matplotlib>=3.9,<4", "pytest>=8,<10", "tifffile>=2026.3,<2027"]
beamline = ["bluesky-queueserver-api>=0.0.12,<0.1"]
